<style>

  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

  button,input,select{font-family:inherit;font-size:inherit;color:inherit}
  button{cursor:pointer;-webkit-appearance:none;appearance:none;border:0;background:none}
  input{-webkit-appearance:none;appearance:none}
  input:focus-visible,button:focus-visible,select:focus-visible{outline:2px solid var(--brand);outline-offset:1px}
  input:focus{outline:none;border-color:var(--brand)}
  #boot{padding:48px 20px;color:var(--faint);text-align:center;font-size:14px}

  /* 화면 단위: 로그인·온보딩은 한 화면에 담고 내부에서만 스크롤 */

    max(20px,env(safe-area-inset-top)) 20px max(20px,env(safe-area-inset-bottom))}
  .grow{flex:1;min-height:0}
  .scroll{overflow-y:auto;-webkit-overflow-scrolling:touch}

  /* 관리자 도구와 같은 결: 흰 카드 + 1px 라인 + 작은 라운드 */
  .card{background:var(--surface);border:1px solid var(--line);border-radius:10px}
  .stepnum{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:5px;
    background:var(--brand);color:#fff;font:700 11px/1 var(--mono);margin-right:8px}
  .num{font-family:var(--mono);font-variant-numeric:tabular-nums}

  /* 단색 버튼 — 그라데이션 없음 */
  .btn{display:block;width:100%;padding:15px;border-radius:10px;font-size:15px;font-weight:700;
    transition:opacity .15s ease,transform .1s ease}
  .btn:active{transform:scale(.985)}
  .btn-primary{background:var(--brand);color:#fff}
  .btn-primary:disabled{background:#D8D8DC;color:#fff;cursor:not-allowed}
  .btn-ghost{background:var(--surface);color:var(--dim);border:1px solid var(--line)}
  .btn-text{background:none;color:var(--faint);font-size:13px;font-weight:500;padding:12px}

  .chip{padding:9px 14px;border-radius:999px;font-size:13.5px;font-weight:650;
    background:var(--surface);border:1px solid #DCDCE2;color:#3E3E48;white-space:nowrap;
    transition:background .14s ease,color .14s ease,border-color .14s ease}
  .chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
  .chiprow{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
  .chiprow::-webkit-scrollbar{display:none}

  .field{width:100%;padding:12px 13px;border:1px solid #DCDCE2;border-radius:9px;
    background:var(--surface);font-family:var(--mono);font-size:16px;font-weight:600;color:var(--ink)}
  .field::placeholder{color:#AFAFB8;font-weight:500}
  .label{display:block;font-size:12px;font-weight:700;color:var(--dim);margin-bottom:6px;letter-spacing:.01em}
  .help{font-size:12px;color:var(--dim);line-height:1.65}
  .korhint{font-family:var(--mono);font-size:12px;color:var(--dim);margin-top:6px;text-align:right;
    font-weight:600;letter-spacing:.01em}
  .hero{display:flex;align-items:center;gap:14px;padding:14px 16px;margin-bottom:12px;
    background:var(--surface);border:1px solid var(--line);border-radius:10px}
  .heroMain{flex:1;min-width:0}

  .divider{width:1px;align-self:stretch;background:var(--line)}

  .tabbar{position:fixed;left:0;right:0;bottom:0;display:flex;background:rgba(250,250,250,.94);

  .tabdot{width:18px;height:3px;border-radius:2px;background:transparent;transition:background .16s ease}

<script>
(function () {
  var NS = "chepicky:";
  window.storage = {
    get: function (k) {
      var raw = localStorage.getItem(NS + k);
      if (raw === null) return Promise.reject(new Error("not found"));
      return Promise.resolve({ key: k, value: raw });
    },
    set: function (k, v) { localStorage.setItem(NS + k, v); return Promise.resolve({ key: k, value: v }); },
    delete: function (k) { localStorage.removeItem(NS + k); return Promise.resolve({ key: k, deleted: true }); }
  };
})();
window.addEventListener("error", function (e) {
  var b = document.getElementById("boot");
  if (b) b.textContent = "오류: " + (e.message || e);
});
</script>

   비워두면 아래 DEFAULT_CARDS(내장 데모 3장)로 동작한다. */
const BACKEND_URL = "";

const ACCENTS = ["#5B4B8A", "#1B4B5A", "#0050FF", "#8A5A2B", "#2E6B4F", "#7A3B5D"];

function adaptCard(payload, i) {
  const tiersRaw = (payload.실적구간 || [])
    .map((t) => Number(t.최소금액) || 0)
    .filter((v, idx, arr) => arr.indexOf(v) === idx)
    .sort((a, b) => a - b);
  const tiers = tiersRaw.length ? tiersRaw : [0];

  // 구간별 전체 한도
  const overall = tiers.map(() => null);
  (payload.월최대적립가능혜택_구간별 || []).forEach((x, idx) => {
    if (idx < overall.length) overall[idx] = x.한도 == null ? null : Number(x.한도);
  });

  const groups = {};
  const rates = {};
  for (const b of payload.혜택 || []) {
    // 앱에 미리 적어둔 목록에 없어도 버리지 않는다.
    // 관리자 도구에서 새 이용처가 생겨도 앱을 고칠 필요가 없어야 하기 때문.
    const cat = normCategory(b.카테고리);
    if (!cat) continue;
    const rate = Number(b.비율) || 0;
    if (rate <= 0) continue;

    const g = b.서비스명 || null;
    if (g && !groups[g]) {
      const caps = tiers.map(() => null);
      (b.월통합한도_구간별 || []).forEach((x, idx) => {
        if (idx < caps.length) caps[idx] = x.한도 == null ? null : Number(x.한도);
      });
      // 구간별 값이 없으면 단일 월한도를 전 구간에 적용
      if (caps.every((c) => c == null) && b.월한도금액)
        for (let k = 0; k < caps.length; k++) caps[k] = Number(b.월한도금액);
      groups[g] = { caps, dailyCap: b.일한도금액 == null ? null : Number(b.일한도금액) };
    }

    // 앱의 perTxnCap은 '1회 인정 이용금액'. 관리자 스키마엔 '건당 최대 혜택'이 있으므로
    // 비율로 역산한다. (5% · 건당 최대 500원 → 1회 10,000원까지 인정)
    let perTxnCap = null;
    if (b.건당최대혜택 && rate > 0) perTxnCap = Math.round(Number(b.건당최대혜택) / (rate / 100));

    const prev = rates[cat];
    if (!prev || rate > prev.rate) rates[cat] = { rate, group: g, perTxnCap };
  }

  // 신규 발급 유예(첫 달~다음 달까지 실적 없이도 혜택) 문구 자동 감지.
  // 상품설명서에 "등록월+1개월", "발급월+1개월" 같은 표현으로 거의 항상 나온다.
  const noteText = (payload.유의사항 || []).concat(payload.실적제외항목 || []).join(" ");
  let newGrace = null;
  if (/발급월\s*\+\s*1개월|등록월\s*\+\s*1개월|다음\s*달\s*말일까지|최초\s*신규\s*발급/.test(noteText)) {
    const half = /50\s*%/.test(noteText);
    newGrace = { months: 1, tierIdx: 0, capRatio: half ? 0.5 : 1,
      note: "발급 후 다음 달 말까지 첫 구간 혜택" + (half ? " (한도 50%)" : "") };
  }

  return {
    id: payload.id || `card-${i}`,
    name: payload.카드명 || "이름 없는 카드",
    sub: payload.카드사 || "",
    issuer: payload.카드사 || "기타",
    accent: ACCENTS[i % ACCENTS.length],
    annualFee: Number(payload.연회비_해외 ?? payload.연회비_국내) || 0,
    newGrace,
    mileageMode: false,
    tiers, overallCaps: overall, groups, rates,
    notes: (payload.유의사항 || []).slice(0, 6),
    fromBackend: true,
  };
}

async function fetchCards(baseUrl) {
  const url = baseUrl.replace(/\/$/, "") + "/api/public/cards";
  const res = await fetch(url, { cache: "no-store" });
  if (!res.ok) throw new Error(`카드 목록을 불러오지 못했습니다 (${res.status})`);
  const data = await res.json();
  const list = (data.cards || []).map(adaptCard).filter((c) => Object.keys(c.rates).length > 0);
  if (!list.length) throw new Error("공개된 카드가 아직 없습니다");
  return list;
}

/* 결제 방식.
   국내 카드는 대체로 무이자 할부 건에 할인·적립을 주지 않고, 전월 실적에서도 뺀다.
   (신한카드 처음: "무이자할부(슬림할부 등 부분 무이자 포함) 이용거래" 적립 제외,
    삼성 iD SELECT: "무이자할부 이용금액" 할인 제외, KB NEED Pay도 동일)
   유이자 할부는 보통 혜택 대상이고 실적에도 들어간다. */
const PAY_TYPES = ["일시불", "할부", "무이자할부"];
const INSTALLMENT_MONTHS = [2, 3, 4, 5, 6, 9, 10, 12, 18, 24];
const isFreeInstallment = (t) => (t && t.pay) === "무이자할부";
const payLabel = (t) => {
  if (!t || !t.pay || t.pay === "일시불") return "";
  return t.pay === "무이자할부" ? `무이자 ${t.months || 0}개월` : `할부 ${t.months || 0}개월`;
};

const K = { picked: "picked-v1", txns: "txns-v1", base: "base-v1", fixed: "fixed-v1",
  backend: "backend-url-v1", cache: "cards-cache-v1" };
const fmt = (n) => Math.round(n || 0).toLocaleString("ko-KR");
const yyyymm = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}`;
const prevYyyymm = (d) => yyyymm(new Date(d.getFullYear(), d.getMonth() - 1, 1));
const tierIndexFor = (card, prevTotal) => {
  let idx = -1;
  for (let i = 0; i < card.tiers.length; i++) if (prevTotal >= card.tiers[i]) idx = i;
  return idx;
};
const uid = () => Date.now().toString(36) + Math.random().toString(16).slice(2, 6);

/* 입력한 숫자를 눈으로 바로 검산할 수 있게 한글 단위로 풀어 쓴다.
   32000 → "3만 2천원" / 1200000 → "120만원" */
function koreanAmount(n) {
  n = Math.floor(Number(n) || 0);
  if (n <= 0) return "";
  const units = [[100000000, "억"], [10000, "만"], [1000, "천"]];
  let rest = n; const out = [];
  for (const [v, label] of units) {
    const q = Math.floor(rest / v);
    if (q > 0) { out.push(q.toLocaleString("ko-KR") + label); rest -= q * v; }
  }
  if (rest > 0) out.push(String(rest));
  return out.join(" ") + "원";
}

/* 금액 입력: 항상 쉼표를 찍고, 아래에 한글 금액을 같이 보여준다. */
function MoneyInput({ value, onChange, placeholder, big, autoFocus }) {
  const digits = String(value ?? "").replace(/[^\d]/g, "");
  const num = Number(digits) || 0;
  return h("div", null,
    h("div", { style: { position: "relative" } },
      h("input", { className: "field", type: "text", inputMode: "numeric",
        autoFocus: !!autoFocus, placeholder: placeholder || "0",
        value: digits ? fmt(num) : "",
        onChange: (e) => onChange(e.target.value.replace(/[^\d]/g, "")),
        style: big
          ? { fontSize: 26, fontWeight: 800, padding: "15px 44px 15px 14px", textAlign: "right" }
          : { paddingRight: 34, textAlign: "right" } }),
      h("span", { style: { position: "absolute", right: big ? 16 : 12, top: "50%",
        transform: "translateY(-50%)", fontSize: big ? 15 : 13, color: "var(--dim)",
        fontWeight: 700, pointerEvents: "none" } }, "원")),
    h("div", { className: "korhint", style: { visibility: num > 0 ? "visible" : "hidden" } },
      koreanAmount(num) || "\u00a0"));
}

/* 남은 한도 계산 (그룹 월한도 / 그룹 일한도 / 카드 전체 한도 중 가장 빡빡한 값) */
function remainingCapFor(card, cat, tIdx, u, dateStr, capRatio) {
  const info = card.rates[cat];
  if (!info) return 0;
  const k = capRatio == null ? 1 : capRatio;
  let rem = Infinity;
  if (info.group && card.groups[info.group]) {
    const g = card.groups[info.group];
    const gCap = g.caps[tIdx];
    if (gCap != null) rem = Math.min(rem, Math.max(gCap * k - (u.byGroup[info.group] || 0), 0));
    if (g.dailyCap != null)
      rem = Math.min(rem, Math.max(g.dailyCap * k - (u.byGroupDay[`${info.group}|${dateStr}`] || 0), 0));
  }
  const oCap = card.overallCaps ? card.overallCaps[tIdx] : null;
  if (oCap != null) rem = Math.min(rem, Math.max(oCap * k - u.total, 0));
  return rem;
}

/* 결제 1건의 혜택. 순수 함수라 '지금 추천'과 '지난 기록 재계산' 양쪽에 같이 쓴다. */
function rewardOf(card, cat, amt, tIdx, u, dateStr, pay, capRatio) {
  const notes = [];
  const info = card.rates[cat];

  // 무이자 할부는 혜택 대상에서 빠진다. 카드별로 다르면 noFreeInstallmentBenefit 로 끈다.
  if (pay === "무이자할부" && card.noFreeInstallmentBenefit !== false)
    return { value: 0, capUsed: 0, detail: "무이자 할부는 혜택 제외", notes,
      blockedBy: "무이자할부" };

  if (!info) return { value: 0, capUsed: 0, detail: "혜택 대상 아님", notes };
  if (tIdx < 0) return { value: 0, capUsed: 0, detail: "전월 실적 미충족", notes };

  const rem = remainingCapFor(card, cat, tIdx, u, dateStr, capRatio);
  let eligible = amt;
  if (info.perTxnCap != null && amt > info.perTxnCap) {
    eligible = info.perTxnCap;
    notes.push(`1회 ${fmt(info.perTxnCap)}원까지만 인정`);
  }

  if (card.mileageMode) {
    if (!info.miles) return { value: 0, capUsed: 0, detail: "적립 대상 아님", notes };
    const full = Math.floor(eligible / 1000) * info.miles;
    let earned, capUsed;
    if (rem === Infinity) { earned = full; capUsed = 0; }
    else if (full <= rem) { earned = full; capUsed = full; }
    else {
      const bonusAmt = (rem / info.miles) * 1000;
      earned = rem + Math.floor((eligible - bonusAmt) / 1000);
      capUsed = rem;
      notes.push("특별적립 한도 초과분은 기본 1마일");
    }
    return { value: earned * (card.mileageValue || 15), capUsed, notes,
      detail: `${fmt(earned)}마일 · 1마일 ${card.mileageValue}원 환산` };
  }

  if (!info.rate) return { value: 0, capUsed: 0, detail: "혜택 대상 아님", notes };
  const raw = (eligible * info.rate) / 100;
  const reward = rem === Infinity ? raw : Math.min(raw, rem);
  if (rem !== Infinity && raw > rem) notes.push("남은 한도까지만 적용");
  return { value: reward, capUsed: rem === Infinity ? 0 : reward, notes,
    detail: `${info.rate}%${rem === Infinity ? " · 한도 없음" : ` · 남은 한도 ${fmt(rem)}원`}` };
}

/* 사용량 누적 반영 */
function applyUsage(card, cat, u, capUsed) {
  u.total += capUsed;
  const g = card.rates[cat] && card.rates[cat].group;
  if (g) {
    u.byGroup[g] = (u.byGroup[g] || 0) + capUsed;
  }
  return u;
}

/* 주어진 결제 목록을 특정 카드로 전부 긁었다고 가정하고 한 달 혜택을 계산한다.
   실적 구간은 그 카드로 그만큼 썼을 때를 가정해 정한다(같은 소비 패턴 유지 가정). */
function simulateCardOnTxns(card, txnList) {
  const spend = txnList
    .filter((t) => !isFreeInstallment(t))
    .reduce((s, t) => s + t.amount, 0);
  const tIdx = card.tiers[0] === 0 ? 0 : tierIndexFor(card, spend);
  if (tIdx < 0) return { benefit: 0, tIdx, spend, tierMet: false };

  const u = { total: 0, byGroup: {}, byGroupDay: {} };
  let benefit = 0;
  for (const t of txnList.slice().sort((a, b) => a.date.localeCompare(b.date))) {
    const r = rewardOf(card, t.category, t.amount, tIdx, u, t.date, t.pay, 1);
    benefit += r.value;
    applyUsage(card, t.category, u, r.capUsed);
    const g = card.rates[t.category] && card.rates[t.category].group;
    if (g) u.byGroupDay[`${g}|${t.date}`] = (u.byGroupDay[`${g}|${t.date}`] || 0) + r.capUsed;
  }
  return { benefit, tIdx, spend, tierMet: true };
}

/* 보유 카드를 다른 카드로 바꿨을 때 이득이 되는지 비교한다.
   연회비 차액을 12로 나눠 월 단위로 환산해 순이득을 계산한다. */
function suggestSwaps(myCards, catalog, monthTxns, minTxns) {
  const out = [];
  for (const owned of myCards) {
    const mine = monthTxns.filter((t) => t.cardId === owned.id);
    if (mine.length < (minTxns || 4)) continue;

    const cur = simulateCardOnTxns(owned, mine);
    for (const cand of catalog) {
      if (cand.id === owned.id) continue;
      if (myCards.some((c) => c.id === cand.id)) continue; // 이미 쓰는 카드는 제외
      const alt = simulateCardOnTxns(cand, mine);
      const feeDiffMonthly = ((cand.annualFee || 0) - (owned.annualFee || 0)) / 12;
      const net = (alt.benefit - cur.benefit) - feeDiffMonthly;
      if (net <= 0) continue;
      out.push({
        from: owned, to: cand, net,
        curBenefit: cur.benefit, altBenefit: alt.benefit,
        feeDiffMonthly, spend: cur.spend, txnCount: mine.length,
        tierMet: alt.tierMet,
      });
    }
  }
  return out.sort((a, b) => b.net - a.net).slice(0, 3);
}

/* ================================================================
   2. 루트
   ================================================================ */
function App() {
  const [loaded, setLoaded] = useState(false);
  const [stage, setStage] = useState("login");
  const [picked, setPicked] = useState([]);
  const [baseline, setBaseline] = useState({});   // {cardId:{prev,curr}}
  const [fixed, setFixed] = useState([]);         // 고정비
  const [txns, setTxns] = useState([]);
  const [tab, setTab] = useState("recommend");
  const [catalog, setCatalog] = useState(DEFAULT_CARDS);
  const [source, setSource] = useState("내장");   // 내장 | 백엔드 | 캐시
  const [syncErr, setSyncErr] = useState("");
  const [backendUrl, setBackendUrl] = useState(BACKEND_URL);

  const now = new Date();
  const today = now.toISOString().slice(0, 10);
  const thisMonth = yyyymm(now);
  const lastMonth = prevYyyymm(now);

  useEffect(() => {
    (async () => {
      const read = async (key, fallback) => {
        try { const r = await window.storage.get(key); return r && r.value ? JSON.parse(r.value) : fallback; }
        catch { return fallback; }
      };
      const p = await read(K.picked, null);
      setPicked(p || []);
      setBaseline(await read(K.base, {}));
      setFixed(await read(K.fixed, []));
      setTxns(await read(K.txns, []));

      // 백엔드 주소: 코드에 박아둔 값보다 설정에서 넣은 값을 우선한다
      const savedUrl = await read(K.backend, null);
      const url = savedUrl || BACKEND_URL;
      setBackendUrl(url || "");

      // 오프라인에서도 뜨도록 지난번에 받아둔 목록을 먼저 깐다
      const cached = await read(K.cache, null);
      if (cached && cached.length) { setCatalog(cached); setSource("캐시"); }

      if (url) {
        try {
          const list = await fetchCards(url);
          setCatalog(list); setSource("백엔드");
          window.storage.set(K.cache, JSON.stringify(list));
        } catch (e) {
          setSyncErr(e.message || "백엔드에 연결하지 못했습니다");
        }
      }

      if (p && p.length) setStage("app");
      setLoaded(true);
    })();
  }, []);

  const save = useCallback((key, val) => {
    try { window.storage.set(key, JSON.stringify(val)); } catch {}
  }, []);
  const savePicked = (v) => { setPicked(v); save(K.picked, v); };
  const saveBaseline = (v) => { setBaseline(v); save(K.base, v); };
  const saveFixed = (v) => { setFixed(v); save(K.fixed, v); };
  const saveTxns = (v) => { setTxns(v); save(K.txns, v); };

  const myCards = useMemo(
    () => catalog.filter((c) => picked.includes(c.id)),
    [catalog, picked]
  );

  /* 카드 선택 화면용: 카드사별로 묶는다 */
  const issuerGroups = useMemo(() => {
    const m = new Map();
    for (const c of catalog) {
      const key = c.issuer || c.sub || "기타";
      if (!m.has(key)) m.set(key, []);
      m.get(key).push(c);
    }
    return [...m.entries()].map(([name, cards]) => ({ name, cards }));
  }, [catalog]);

  const reloadCards = useCallback(async (url) => {
    const target = (url != null ? url : backendUrl).trim();
    setBackendUrl(target);
    window.storage.set(K.backend, JSON.stringify(target));
    setSyncErr("");
    if (!target) { setCatalog(DEFAULT_CARDS); setSource("내장"); return; }
    try {
      const list = await fetchCards(target);
      setCatalog(list); setSource("백엔드");
      window.storage.set(K.cache, JSON.stringify(list));
    } catch (e) { setSyncErr(e.message || "연결 실패"); }
  }, [backendUrl]);

  /* 고정비는 매달 자동으로 이번 달 사용분에 반영된다 (사용자가 매번 입력하지 않도록) */
  /* 고정비 → 이번 달 가상 결제 건. 등록한 결제일에 발생한 것으로 본다. */
  const fixedTxns = useMemo(
    () => fixed.filter((f) => f.cardId && f.amount > 0).map((f) => ({
      id: "fx-" + f.id, cardId: f.cardId, category: f.category,
      amount: Number(f.amount), fixed: true, label: f.label,
      date: `${thisMonth}-${String(Math.min(Math.max(Number(f.day) || 1, 1), 28)).padStart(2, "0")}`,
    })),
    [fixed, thisMonth]
  );

  const allTxns = useMemo(() => txns.concat(fixedTxns), [txns, fixedTxns]);

  /* 지난달 실적: 앱에 기록이 쌓였으면 그 값을 쓰고, 없으면 온보딩에서 고른 '단계'를 쓴다. */
  const prevLogTotals = useMemo(() => {
    const m = {};
    for (const c of myCards)
      m[c.id] = allTxns
        .filter((t) => t.cardId === c.id && t.date.slice(0, 7) === lastMonth && !isFreeInstallment(t))
        .reduce((s, t) => s + t.amount, 0);
    return m;
  }, [myCards, allTxns, lastMonth]);

  const currTotals = useMemo(() => {
    const m = {};
    for (const c of myCards) {
      // 무이자 할부는 전월 실적 산정에서 빠지므로 이번 달 실적에도 넣지 않는다
      m[c.id] = Number((baseline[c.id] || {}).curr || 0)
        + allTxns
          .filter((t) => t.cardId === c.id && t.date.slice(0, 7) === thisMonth && !isFreeInstallment(t))
          .reduce((s, t) => s + t.amount, 0);
    }
    return m;
  }, [myCards, allTxns, baseline, thisMonth]);

  const tierInfo = useCallback((card) => {
    const b = baseline[card.id] || {};
    const logged = prevLogTotals[card.id] || 0;
    let idx;
    if (logged > 0) idx = tierIndexFor(card, logged);
    else if (b.tier != null) idx = b.tier;
    else idx = card.tiers[0] === 0 ? 0 : -1;

    // 신규 발급 유예: 실적이 모자라도 카드사가 첫 구간 혜택을 미리 주는 기간.
    // 사용자가 '유예 기간에 해당한다'고 답한 카드에만 적용한다.
    let grace = false;
    if (card.newGrace && b.isNew && idx < card.newGrace.tierIdx) {
      idx = card.newGrace.tierIdx;
      grace = true;
    }
    return { idx, active: idx >= 0, loggedPrev: logged, grace,
      capRatio: grace ? (card.newGrace.capRatio || 1) : 1,
      nextThreshold: idx + 1 < card.tiers.length ? card.tiers[idx + 1] : null };
  }, [baseline, prevLogTotals]);

  /* 이번 달 결제를 날짜순으로 다시 계산한다.
     혜택 금액을 결제 시점에 저장해두지 않고 매번 계산하기 때문에,
     고정비도 그대로 혜택에 잡히고 내역을 수정하면 즉시 전체가 다시 맞춰진다. */
  const sim = useMemo(() => {
    const usage = {};
    const byTxn = {};
    for (const c of myCards) {
      const u = { total: 0, byGroup: {}, byGroupDay: {} };
      const ti = tierInfo(c);
      const tIdx = ti.idx;
      const mine = allTxns
        .filter((t) => t.cardId === c.id && t.date.slice(0, 7) === thisMonth)
        .sort((a, b) => (a.date === b.date ? String(a.id).localeCompare(String(b.id))
                                           : a.date.localeCompare(b.date)));
      for (const t of mine) {
        const r = rewardOf(c, t.category, t.amount, tIdx, u, t.date, t.pay, ti.capRatio);
        byTxn[t.id] = r;
        applyUsage(c, t.category, u, r.capUsed);
        const g = c.rates[t.category] && c.rates[t.category].group;
        if (g) u.byGroupDay[`${g}|${t.date}`] = (u.byGroupDay[`${g}|${t.date}`] || 0) + r.capUsed;
      }
      usage[c.id] = u;
    }
    return { usage, byTxn };
  }, [myCards, allTxns, thisMonth, tierInfo]);

  const usageByCard = sim.usage;

  const calcReward = useCallback((card, cat, amt, pay) => {
    const t = tierInfo(card);
    const u = usageByCard[card.id] || { total: 0, byGroup: {}, byGroupDay: {} };
    return { ...rewardOf(card, cat, amt, t.idx, u, today, pay, t.capRatio), tier: t };
  }, [tierInfo, usageByCard, today]);

  /* 고른 카드가 실제로 혜택을 주는 이용처만 노출한다.
     카드를 바꾸면 이 목록도 바뀐다. 앱이 모르는 이용처가 백엔드에서 와도
     버리지 않고 뒤에 붙여, 관리자 쪽에서 이용처를 늘려도 앱 수정이 필요 없다. */
  const myCategories = useMemo(() => {
    const set = new Set();
    for (const c of myCards)
      for (const cat of Object.keys(c.rates)) {
        const r = c.rates[cat];
        if ((r.rate && r.rate > 0) || (r.miles && r.miles > 0)) set.add(cat);
      }
    const known = ALL_CATEGORIES.filter((x) => set.has(x));
    const unknown = [...set].filter((x) => !ALL_CATEGORIES.includes(x)).sort();
    return known.concat(unknown);
  }, [myCards]);

  if (!loaded) return h("div", { id: "boot" }, "불러오는 중…");

  if (stage === "login")
    return h(LoginScreen, { onNext: () => setStage("cards") });

  if (stage === "cards")
    return h(CardScreen, {
      picked, setPicked: savePicked, issuerGroups, catalog, source, syncErr,
      onNext: () => setStage(picked.length ? "baseline" : "app"),
    });

  if (stage === "baseline")
    return h(BaselineScreen, {
      myCards, baseline, setBaseline: saveBaseline, lastMonth, thisMonth,
      onNext: () => setStage("fixed"),
    });

  if (stage === "fixed")
    return h(FixedScreen, {
      myCards, fixed, setFixed: saveFixed, calcReward, onNext: () => setStage("app"),
    });

  return h(MainApp, {
    myCards, myCategories, tab, setTab, calcReward, tierInfo, usageByCard,
    currTotals, txns, saveTxns, allTxns, fixed, saveFixed, txnResults: sim.byTxn,
    baseline, setBaseline: saveBaseline, today, thisMonth, lastMonth,
    onEditCards: () => setStage("cards"), picked, catalog,
    backendUrl, reloadCards, source, syncErr,
  });
}

/* 앞말 받침에 따라 '으로' / '로' 를 고른다 */
function josa(word) {
  const last = (word || "").trim().slice(-1);
  const code = last.charCodeAt(0);
  if (!code || code < 0xac00 || code > 0xd7a3) return "로";
  const jong = (code - 0xac00) % 28;
  return jong === 0 || jong === 8 ? "로" : "으로";
}

/* 고정비 한 줄. 카드별 예상 혜택을 같이 보여주고, 더 나은 카드가 있으면 알려준다. */
function FixedRow({ f, myCards, calcReward, patch, remove }) {
  const amt = Number(f.amount) || 0;
  const ranked = useMemo(() => {
    if (amt <= 0) return [];
    return myCards.map((c) => ({ card: c, ...calcReward(c, f.category, amt) }))
      .sort((a, b) => b.value - a.value);
  }, [myCards, calcReward, f.category, amt]);
  const best = ranked[0];
  const chosen = ranked.find((r) => r.card.id === f.cardId);
  const better = best && chosen && best.card.id !== chosen.card.id && best.value > chosen.value;

  return h("div", { className: "card", style: { padding: "12px 13px", marginBottom: 7 } },
    h("div", { style: { display: "flex", alignItems: "center", gap: 8, marginBottom: 9 } },
      h("b", { style: { fontSize: 14, flex: 1 } }, f.label),
      f.category !== f.label && h("span", { style: { fontSize: 11, color: "var(--faint)" } }, f.category),
      h("button", { onClick: remove,
        style: { color: "var(--faint)", fontSize: 18, padding: "0 2px" } }, "\u00d7")),

    h("div", { style: { display: "flex", gap: 10, alignItems: "flex-start" } },
      h("div", { style: { flex: 1 } },
        h("span", { className: "label" }, "매달 나가는 금액"),
        h(MoneyInput, { value: f.amount, onChange: (v) => patch("amount", Number(v) || 0) })),
      h("div", { style: { width: 96 } },
        h("span", { className: "label" }, "결제일"),
        h("div", { style: { position: "relative" } },
          h("select", { className: "field", value: f.day || 1,
            onChange: (e) => patch("day", Number(e.target.value)),
            style: { fontFamily: "var(--mono)", textAlign: "left", paddingRight: 26 } },
            Array.from({ length: 28 }, (_, i) => i + 1).map((d) =>
              h("option", { key: d, value: d }, d + "일")))))),

    h("div", { style: { marginTop: 8 } },
      h("span", { className: "label" }, "어느 카드로 결제되나요?"),
      h("div", { style: { display: "flex", flexDirection: "column", gap: 5 } },
        myCards.map((c) => {
          const r = ranked.find((x) => x.card.id === c.id);
          const on = f.cardId === c.id;
          return h("button", { key: c.id, onClick: () => patch("cardId", c.id),
            style: { display: "flex", alignItems: "center", gap: 9, padding: "9px 11px",
              borderRadius: 8, textAlign: "left",
              border: "1px solid " + (on ? "var(--brand)" : "#E4E4EA"),
              background: on ? "var(--brand-soft)" : "var(--surface)" } },
            h("span", { style: { width: 15, height: 15, borderRadius: 999, flexShrink: 0,
              border: "1.5px solid " + (on ? "var(--brand)" : "#CFCFD6"),
              background: on ? "var(--brand)" : "transparent",
              boxShadow: on ? "inset 0 0 0 2.5px #fff" : "none" } }),
            h("span", { style: { flex: 1, fontSize: 13, fontWeight: 600, overflow: "hidden",
              textOverflow: "ellipsis", whiteSpace: "nowrap" } }, c.name),
            amt > 0 && h("span", { className: "num",
              style: { fontSize: 13, fontWeight: 700, flexShrink: 0,
                color: r && r.value > 0 ? "var(--good)" : "var(--faint)" } },
              r && r.value > 0 ? "+" + fmt(r.value) + "원" : "혜택 없음"));
        }))),

    better && h("div", { style: { marginTop: 9, padding: "10px 12px", borderRadius: 8,
      background: "var(--brand-soft)", border: "1px solid var(--brand-line)",
      fontSize: 12.5, color: "var(--brand)", fontWeight: 650, lineHeight: 1.55 } },
      `\u2018${best.card.name}\u2019${josa(best.card.name)} 결제 변경하시는 걸 추천드려요! `,
      h("span", { className: "num" }, `매달 ${fmt(best.value - chosen.value)}원`), " 더 받습니다."));
}

/* ================================================================

        : fixed.map((f) => h(FixedRow, { key: f.id, f, myCards, calcReward,
            patch: (k, v) => setFixed(fixed.map((x) => (x.id === f.id ? { ...x, [k]: v } : x))),
            remove: () => setFixed(fixed.filter((x) => x.id !== f.id)) }))),

    h("div", { style: { paddingTop: 12 } },
      h("button", { className: "btn btn-primary", onClick: onNext }, "시작하기"),
      h("button", { className: "btn btn-text", onClick: onNext }, "건너뛰기")));
}

/* ================================================================
   7. 메인 앱
   ================================================================ */
function MainApp(props) {
  const { myCards, tab, setTab, allTxns, thisMonth } = props;
  const { txnResults } = props;
  const summary = useMemo(() => {
    const mine = allTxns.filter((t) => t.date.slice(0, 7) === thisMonth);
    const spent = mine.reduce((s, t) => s + t.amount, 0);
    const reward = mine.reduce((s, t) => s + ((txnResults[t.id] || {}).value || 0), 0);
    return { spent, reward, rate: spent > 0 ? (reward / spent) * 100 : null, count: mine.length };
  }, [allTxns, thisMonth, txnResults]);
  const p = { ...props, summary };
  return h("div", { style: { paddingBottom: 78, minHeight: "100dvh" } },
    h("header", { style: { display: "flex", alignItems: "center", justifyContent: "space-between",
      padding: "max(14px,env(safe-area-inset-top)) 18px 12px" } },
      h("img", { src: "brand/logo-cherry.png", alt: "Chepicky", style: { height: 22 } }),
      h("span", { style: { fontSize: 11, color: "var(--faint)", fontWeight: 600 } },
        `카드 ${myCards.length}장`)),
    h("div", { className: "fade", key: tab },
      tab === "recommend" && h(RecommendTab, p),
      tab === "status" && h(StatusTab, p),
      tab === "settings" && h(SettingsTab, p)),
    h("nav", { className: "tabbar" },
      [["recommend", "추천"], ["status", "이번 달"], ["settings", "설정"]].map(([k, label]) =>
        h("button", { key: k, className: "tabbtn" + (tab === k ? " on" : ""),
          onClick: () => { setTab(k); window.scrollTo({ top: 0, behavior: "smooth" }); } },
          h("span", { className: "tabdot" }), label))));
}

/* ---------------- 추천 ---------------- */
function RecommendTab({ myCards, myCategories, calcReward, txns, saveTxns, today, currTotals, tierInfo, summary }) {
  const [category, setCategory] = useState(myCategories[0] || "음식점");
  // 카드를 바꿔서 고른 이용처가 목록에서 사라지면 첫 항목으로 되돌린다
  useEffect(() => {
    if (myCategories.length && !myCategories.includes(category)) setCategory(myCategories[0]);
  }, [myCategories, category]);
  const [amount, setAmount] = useState("");
  const [result, setResult] = useState(null);
  const [q, setQ] = useState("");
  const [pay, setPay] = useState("일시불");
  const [months, setMonths] = useState(3);
  const amt = Number(amount) || 0;
  // 이용처가 많을 때만 검색칸을 띄워 평소 화면은 단순하게 유지한다
  const searchable = myCategories.length > 8;
  const shown = q ? myCategories.filter((c) => matchCategory(c, q)) : myCategories;

  // 선택한 칩이 가로 스크롤 밖으로 밀려 안 보이는 일이 없도록 항상 화면 안으로 당겨온다
  const selectedRef = useRef(null);
  useEffect(() => {
    const el = selectedRef.current;
    if (el && el.scrollIntoView)
      el.scrollIntoView({ behavior: "smooth", block: "nearest", inline: "center" });
  }, [category, q]);

  const run = () => {
    if (amt <= 0) return;
    const ranked = myCards.map((c) => ({ card: c, ...calcReward(c, category, amt, pay) }))
      .sort((a, b) => b.value - a.value);
    setResult({ amt, category, pay, months, ranked });
  };

  const log = (r) => {
    saveTxns(txns.concat({
      id: uid(), date: today, cardId: r.card.id, category, amount: amt,
      pay, months: pay === "일시불" ? null : months,
    }));
    setResult(null); setAmount("");
  };

  return h("div", { style: { padding: "0 18px" } },
    // 피킹률 — 서비스의 핵심 지표라 첫 화면 최상단에 고정
    h("div", { className: "hero" },
      h("div", { className: "heroMain" },
        h("div", { style: { fontSize: 12, color: "var(--dim)", fontWeight: 700, marginBottom: 5 } },
          "이번 달 피킹률"),
        h("div", { style: { display: "flex", alignItems: "baseline", gap: 5 } },
          h("span", { className: "heroRate" }, summary.rate == null ? "—" : summary.rate.toFixed(2)),
          summary.rate != null && h("span", { style: { fontSize: 16, fontWeight: 800,
            color: "var(--brand)" } }, "%")),
        h("div", { style: { fontSize: 12, color: "var(--dim)", marginTop: 6 } },
          summary.rate == null ? "결제를 기록하면 계산돼요"
            : h("span", null, "쓴 돈 ", h("b", { className: "num" }, fmt(summary.spent)), "원"))),
      h("div", { className: "divider" }),
      h("div", { style: { textAlign: "right", minWidth: 84 } },
        h("div", { style: { fontSize: 12, color: "var(--dim)", fontWeight: 700, marginBottom: 5 } },
          "돌려받은 돈"),
        h("div", { className: "num", style: { fontSize: 19, fontWeight: 800, color: "var(--good)" } },
          fmt(summary.reward)),
        h("div", { style: { fontSize: 11, color: "var(--faint)", marginTop: 4 } },
          summary.count + "건 기록"))),

    h("section", { className: "card", style: { padding: 16, marginBottom: 14 } },
      h("div", { style: { display: "flex", alignItems: "center", gap: 8, marginBottom: 6 } },
        h("span", { className: "label", style: { margin: 0, flex: 1 } }, "어디에 결제하나요?"),
        h("span", { style: { fontSize: 12.5, fontWeight: 800, color: "var(--brand)",
          background: "var(--brand-soft)", border: "1px solid var(--brand-line)",
          padding: "3px 10px", borderRadius: 999, maxWidth: "60%", overflow: "hidden",
          textOverflow: "ellipsis", whiteSpace: "nowrap" } }, category)),
      searchable && h("input", { className: "field", value: q,
        placeholder: "가게 이름으로 찾기 (예: 스타벅스)",
        onChange: (e) => setQ(e.target.value),
        style: { fontFamily: "var(--sans)", fontSize: 14, fontWeight: 500,
          textAlign: "left", marginBottom: 9, padding: "10px 12px" } }),
      h("div", { className: "chiprow", style: { marginBottom: 15 } },
        shown.length === 0
          ? h("span", { className: "help", style: { color: "var(--faint)", padding: "4px 2px" } },
              "찾는 이용처가 없어요")
          : shown.map((c) => h("button", { key: c, className: "chip" + (category === c ? " on" : ""),
              ref: category === c ? selectedRef : null,
              onClick: () => { setCategory(c); setQ(""); setResult(null); } }, c))),
      h("span", { className: "label" }, "얼마를 쓰나요?"),
      h("div", { style: { marginBottom: 12 } },
        h(MoneyInput, { big: true, value: amount,
          onChange: (v) => { setAmount(v); setResult(null); } })),

      h("span", { className: "label" }, "결제 방식"),
      h("div", { style: { display: "flex", gap: 6, marginBottom: pay === "일시불" ? 14 : 9 } },
        PAY_TYPES.map((t) => h("button", { key: t,
          className: "chip" + (pay === t ? " on" : ""),
          onClick: () => { setPay(t); setResult(null); },
          style: { flex: 1, textAlign: "center" } }, t))),

      pay !== "일시불" && h("div", { style: { marginBottom: 14 } },
        h("select", { className: "field", value: months,
          onChange: (e) => { setMonths(Number(e.target.value)); setResult(null); },
          style: { fontFamily: "var(--sans)", fontSize: 14, textAlign: "left" } },
          INSTALLMENT_MONTHS.map((m) => h("option", { key: m, value: m }, m + "개월")))),

      pay === "무이자할부" && h("div", { className: "help", style: { marginBottom: 14,
        padding: "10px 12px", borderRadius: 9, background: "var(--warn-soft)",
        border: "1px solid #F0E2C0", color: "var(--warn)" } },
        "무이자 할부는 대부분의 카드에서 할인·적립이 제외되고 전월 실적에도 잡히지 않아요."),

      h("button", { className: "btn btn-primary", onClick: run, disabled: amt <= 0 }, "추천받기")),

    result && h(ResultView, { result, log }),

    !result && h(TierStrip, { myCards, tierInfo, currTotals }));
}

function ResultView({ result, log }) {
  const [best, ...rest] = result.ranked;
  if (!best) return null;

  // 무이자 할부는 어느 카드로 긁어도 혜택이 0이다.
  // 순위를 매기는 대신 그 사실과 대안을 알려주는 편이 정직하고 쓸모 있다.
  if (result.pay === "무이자할부")
    return h("div", { className: "fade" },
      h("section", { className: "card", style: { padding: 16, marginBottom: 10 } },
        h("div", { style: { fontSize: 15, fontWeight: 800, marginBottom: 8 } },
          "무이자 할부는 어느 카드든 혜택이 없어요"),
        h("div", { className: "help", style: { marginBottom: 12 } },
          "무이자 할부 건은 할인·적립 대상에서 빠지고, 다음 달 실적에도 잡히지 않습니다. ",
          "혜택을 받으려면 일시불이나 유이자 할부로 결제해야 해요."),
        h("div", { style: { padding: "11px 12px", borderRadius: 9, background: "#F6F6F9",
          border: "1px solid var(--line)" } },
          h("div", { className: "help" },
            "일시불로 결제하면 ", h("b", { style: { color: "var(--brand)" } },
              result.ranked[0] ? result.ranked[0].card.name : ""),
            " 기준 혜택을 받을 수 있는지 다시 확인해보세요.")),
        h("div", { style: { display: "flex", flexDirection: "column", gap: 6, marginTop: 12 } },
          result.ranked.map((r) =>
            h("button", { key: r.card.id, onClick: () => log(r),
              style: { display: "flex", alignItems: "center", gap: 9, padding: "10px 12px",
                border: "1px solid var(--line)", borderRadius: 8, background: "var(--surface)",
                textAlign: "left" } },
              h("span", { style: { flex: 1, fontSize: 13, fontWeight: 600 } }, r.card.name),
              h("span", { style: { fontSize: 11, color: "var(--faint)" } }, "이 카드로 기록"))))));

  return h("div", { className: "fade" },
    h("section", { className: "card", style: { padding: 16, marginBottom: 10,
      borderColor: "var(--brand)", background: "var(--brand-soft)" } },
      h("div", { style: { display: "flex", alignItems: "center", gap: 7, marginBottom: 9 } },
        h("span", { style: { fontSize: 10, fontWeight: 800, color: "#fff", background: "var(--brand)",
          padding: "3px 7px", borderRadius: 5, letterSpacing: ".04em" } }, "BEST"),
        h("span", { style: { fontSize: 11, color: "var(--dim)" } }, result.category)),
      h("div", { style: { fontSize: 17, fontWeight: 800, marginBottom: 3 } }, best.card.name),
      h("div", { style: { display: "flex", alignItems: "baseline", gap: 5, margin: "8px 0 4px" } },
        h("span", { className: "num", style: { fontSize: 30, fontWeight: 800, color: "var(--brand)",
          letterSpacing: "-.02em" } }, fmt(best.value)),
        h("span", { style: { fontSize: 14, fontWeight: 700, color: "var(--brand)" } }, "원 혜택")),
      h("div", { style: { fontSize: 12, color: "var(--dim)" } }, best.detail),
      best.notes.map((n, i) => h("div", { key: i,
        style: { fontSize: 11, color: "var(--warn)", marginTop: 5 } }, "· " + n)),
      h("button", { className: "btn btn-primary", onClick: () => log(best), style: { marginTop: 13 } },
        "이 카드로 결제했어요")),

    rest.filter((r) => r.value > 0 || r.detail).map((r, i) =>
      h("div", { key: r.card.id, className: "card",
        style: { padding: "12px 14px", marginBottom: 7, display: "flex", alignItems: "center", gap: 11 } },
        h("span", { className: "num", style: { fontSize: 11, color: "var(--faint)", width: 14 } }, i + 2),
        h("div", { style: { flex: 1, minWidth: 0 } },
          h("div", { style: { fontSize: 13, fontWeight: 650, overflow: "hidden",
            textOverflow: "ellipsis", whiteSpace: "nowrap" } }, r.card.name),
          h("div", { style: { fontSize: 11, color: "var(--faint)", marginTop: 2 } }, r.detail)),
        h("span", { className: "num", style: { fontSize: 15, fontWeight: 700,
          color: r.value > 0 ? "var(--ink)" : "var(--faint)" } }, fmt(r.value) + "원"),
        h("button", { onClick: () => log(r),
          style: { fontSize: 11, color: "var(--dim)", padding: "6px 9px", border: "1px solid var(--line)",
            borderRadius: 7, background: "var(--surface)", flexShrink: 0 } }, "선택"))));
}

/* 추천 전 기본 화면: 카드별 실적 진행 상황을 한 눈에 */
function TierStrip({ myCards, tierInfo, currTotals }) {
  return h("section", null,
    h("div", { className: "label", style: { marginBottom: 8 } }, "이번 달 실적 현황"),
    myCards.map((c) => {
      const t = tierInfo(c);
      const curr = currTotals[c.id] || 0;
      const target = t.nextThreshold || c.tiers[c.tiers.length - 1] || 0;
      const pct = target > 0 ? Math.min(100, (curr / target) * 100) : 100;
      return h("div", { key: c.id, className: "card", style: { padding: "12px 14px", marginBottom: 7 } },
        h("div", { style: { display: "flex", alignItems: "center", gap: 8, marginBottom: 9 } },
          h("span", { style: { width: 3, height: 13, borderRadius: 2, background: c.accent } }),
          h("span", { style: { fontSize: 13, fontWeight: 650, flex: 1 } }, c.name),
          h("span", { style: { fontSize: 10, fontWeight: 700, padding: "3px 7px", borderRadius: 5,
            background: t.active ? "#F1F9F5" : "var(--warn-soft)",
            color: t.active ? "var(--good)" : "var(--warn)" } },
            t.grace ? "신규 혜택 적용 중" : t.active ? `${t.idx + 1}구간 적용 중` : "실적 미달")),
        target > 0 && h("div", null,
          h("div", { style: { height: 5, borderRadius: 3, background: "#EFEFF2", overflow: "hidden" } },
            h("div", { style: { height: "100%", width: pct + "%", background: c.accent, borderRadius: 3,
              transition: "width .4s ease" } })),
          h("div", { style: { display: "flex", justifyContent: "space-between", marginTop: 6,
            fontSize: 11, color: "var(--faint)" } },
            h("span", { className: "num" }, fmt(curr) + "원"),
            h("span", null, t.nextThreshold
              ? `다음 구간까지 ${fmt(Math.max(t.nextThreshold - curr, 0))}원`
              : "최고 구간"))));
    }));
}

/* 결제 내역 직접 입력·수정 폼 */

    h("div", { style: { display: "flex", gap: 10, marginBottom: 10 } },

        h("span", { className: "label" }, "날짜"),

      "무이자 할부는 혜택과 실적에서 모두 빠집니다."),

    h("div", { style: { display: "flex", gap: 8 } },

/* ---------------- 이번 달 ---------------- */
function StatusTab({ myCards, myCategories, tierInfo, usageByCard, txns, saveTxns, allTxns,
  thisMonth, today, summary, txnResults, catalog }) {
  const [editing, setEditing] = useState(null); // txn id | "new"
  const [draft, setDraft] = useState(null);
  const [cardFilter, setCardFilter] = useState("all");

  const monthTxns = allTxns.filter((t) => t.date.slice(0, 7) === thisMonth);
  const mine = cardFilter === "all" ? monthTxns : monthTxns.filter((t) => t.cardId === cardFilter);
  const rate = summary.rate;

  const startNew = () => {
    setEditing("new");
    setDraft({ date: today, cardId: myCards[0]?.id || "", category: myCategories[0] || "",
      amount: "", pay: "일시불", months: null });
  };
  const startEdit = (t) => {
    if (t.fixed) return; // 고정비는 설정에서 관리
    setEditing(t.id);
    setDraft({ date: t.date, cardId: t.cardId, category: t.category, amount: String(t.amount),
      pay: t.pay || "일시불", months: t.months || null });
  };
  const save = () => {
    const clean = { date: draft.date, cardId: draft.cardId, category: draft.category,
      amount: Number(String(draft.amount).replace(/[^\d]/g, "")) || 0,
      pay: draft.pay || "일시불", months: draft.pay === "일시불" ? null : (draft.months || 3) };
    if (editing === "new") saveTxns(txns.concat({ id: uid(), ...clean }));
    else saveTxns(txns.map((x) => (x.id === editing ? { ...x, ...clean } : x)));
    setEditing(null); setDraft(null);
  };
  const del = () => {
    saveTxns(txns.filter((x) => x.id !== editing));
    setEditing(null); setDraft(null);
  };

  return h("div", { style: { padding: "0 18px" } },
    h("section", { className: "card", style: { padding: 16, marginBottom: 12 } },
      h("div", { style: { display: "flex", gap: 14 } },
        h("div", { style: { flex: 1 } },
          h("div", { className: "label" }, "이번 달 사용"),
          h("div", { className: "num", style: { fontSize: 21, fontWeight: 800 } }, fmt(summary.spent),
            h("span", { style: { fontSize: 12, fontWeight: 600, color: "var(--faint)" } }, "원"))),
        h("div", { className: "divider" }),
        h("div", { style: { flex: 1 } },
          h("div", { className: "label" }, "피킹률"),
          h("div", { className: "num", style: { fontSize: 21, fontWeight: 800, color: "var(--brand)" } },
            rate == null ? "—" : rate.toFixed(2) + "%"),
          h("div", { style: { fontSize: 11, color: "var(--dim)", marginTop: 2 } },
            "혜택 " + fmt(summary.reward) + "원")))),

    h(SwapSuggest, { myCards, catalog, monthTxns }),

    h("div", { className: "label", style: { marginBottom: 8 } }, "카드별 혜택 한도"),
    myCards.map((c) => {
      const t = tierInfo(c);
      const u = usageByCard[c.id] || { total: 0, byGroup: {} };
      const oCap = c.overallCaps && t.idx >= 0 ? c.overallCaps[t.idx] : null;
      return h("div", { key: c.id, className: "card", style: { padding: "12px 14px", marginBottom: 7 } },
        h("div", { style: { display: "flex", alignItems: "center", gap: 8, marginBottom: 8 } },
          h("span", { style: { width: 3, height: 13, borderRadius: 2, background: c.accent } }),
          h("span", { style: { fontSize: 13, fontWeight: 650, flex: 1 } }, c.name),
          oCap != null && h("span", { className: "num", style: { fontSize: 11, color: "var(--dim)" } },
            `${fmt(Math.max(oCap - u.total, 0))} / ${fmt(oCap)}원`)),
        t.active
          ? Object.keys(c.groups).map((g) => {
              const cap = c.groups[g].caps[t.idx];
              if (cap == null) return null;
              const used = u.byGroup[g] || 0;
              const pct = Math.min(100, (used / cap) * 100);
              return h("div", { key: g, style: { marginTop: 7 } },
                h("div", { style: { display: "flex", justifyContent: "space-between",
                  fontSize: 11, color: "var(--dim)", marginBottom: 4 } },
                  h("span", null, g),
                  h("span", { className: "num" }, `${fmt(Math.max(cap - used, 0))}원 남음`)),
                h("div", { style: { height: 4, borderRadius: 2, background: "#EFEFF2", overflow: "hidden" } },
                  h("div", { style: { height: "100%", width: pct + "%", borderRadius: 2,
                    background: pct >= 100 ? "var(--brand)" : c.accent } })));
            })
          : h("div", { style: { fontSize: 11, color: "var(--warn)" } },
              `전월 실적 ${fmt(c.tiers[0])}원을 채우면 혜택이 켜져요`));
    }),

    h("div", { style: { display: "flex", alignItems: "center", gap: 8, margin: "16px 0 8px" } },
      h("span", { className: "label", style: { margin: 0, flex: 1 } }, `결제 기록 ${mine.length}건`),
      editing !== "new" && h("button", { onClick: startNew,
        style: { fontSize: 12.5, fontWeight: 700, color: "var(--brand)", padding: "4px 2px" } },
        "+ 직접 추가")),

    myCards.length > 1 && h("div", { className: "chiprow", style: { marginBottom: 9 } },
      [{ id: "all", name: "전체" }].concat(myCards).map((c) => {
        const n = c.id === "all" ? monthTxns.length
          : monthTxns.filter((t) => t.cardId === c.id).length;
        return h("button", { key: c.id, onClick: () => setCardFilter(c.id),
          className: "chip" + (cardFilter === c.id ? " on" : "") },
          c.name, h("span", { className: "num", style: { marginLeft: 5, opacity: .7 } }, n));
      })),

    editing === "new" && h(TxnForm, { draft, setDraft, myCards, myCategories,
      onSave: save, onCancel: () => { setEditing(null); setDraft(null); } }),

    mine.length === 0 && editing !== "new"
      ? h("div", { className: "card", style: { padding: "24px 16px", textAlign: "center",
          fontSize: 13, color: "var(--faint)", lineHeight: 1.7 } },
          cardFilter === "all"
            ? h("span", null, "아직 기록이 없어요.", h("br"), "추천을 받거나 직접 추가해보세요.")
            : "이 카드로 결제한 기록이 없어요.")
      : mine.slice().sort((a, b) => b.date.localeCompare(a.date)).map((t) => {
          if (editing === t.id)
            return h(TxnForm, { key: t.id, draft, setDraft, myCards, myCategories,
              onSave: save, onCancel: () => { setEditing(null); setDraft(null); }, onDelete: del });
          const c = myCards.find((x) => x.id === t.cardId);
          const r = txnResults[t.id] || {};
          return h("button", { key: t.id, className: "card", onClick: () => startEdit(t),
            style: { width: "100%", padding: "11px 13px", marginBottom: 6, display: "flex",
              alignItems: "center", gap: 10, textAlign: "left",
              cursor: t.fixed ? "default" : "pointer" } },
            h("div", { style: { flex: 1, minWidth: 0 } },
              h("div", { style: { fontSize: 13, fontWeight: 600 } },
                t.fixed ? t.label : t.category,
                t.fixed && h("span", { style: { fontSize: 10, color: "var(--faint)",
                  marginLeft: 6, fontWeight: 500 } }, "고정비")),
              h("div", { style: { fontSize: 11, color: "var(--faint)", marginTop: 2 } },
                `${t.date.slice(5).replace("-", "/")} · ${c ? c.name : "카드"}`,
                payLabel(t) && h("span", { style: {
                  marginLeft: 6, padding: "1px 6px", borderRadius: 4,
                  background: isFreeInstallment(t) ? "var(--warn-soft)" : "#EFEFF2",
                  color: isFreeInstallment(t) ? "var(--warn)" : "var(--dim)",
                  fontWeight: 650 } }, payLabel(t)))),
            h("div", { style: { textAlign: "right", flexShrink: 0 } },
              h("div", { className: "num", style: { fontSize: 14, fontWeight: 700 } }, fmt(t.amount) + "원"),
              r.value > 0 && h("div", { className: "num",
                style: { fontSize: 11, color: "var(--good)", marginTop: 1 } }, "+" + fmt(r.value))),
            !t.fixed && h("span", { style: { fontSize: 11, color: "var(--faint)", flexShrink: 0 } }, "\u203a"));
        }));
}

/* 카드 교체 제안. 계산 근거를 반드시 같이 보여준다 —
   "얼마 더 받는다"만 있으면 사용자가 믿을 근거가 없기 때문. */
function SwapSuggest({ myCards, catalog, monthTxns }) {
  const [open, setOpen] = useState(null);
  const MIN = 4;
  const swaps = useMemo(
    () => suggestSwaps(myCards, catalog, monthTxns, MIN),
    [myCards, catalog, monthTxns]
  );

  const enough = myCards.some((c) => monthTxns.filter((t) => t.cardId === c.id).length >= MIN);
  if (!enough)
    return h("div", { className: "card", style: { padding: "14px 15px", marginBottom: 14 } },
      h("div", { style: { fontSize: 13, fontWeight: 700, marginBottom: 5 } }, "카드 교체 분석"),
      h("div", { className: "help", style: { color: "var(--faint)" } },
        `결제 기록이 카드당 ${MIN}건 이상 쌓이면, 등록된 모든 카드와 비교해 더 나은 카드를 찾아드려요.`));

  if (!swaps.length)
    return h("div", { className: "card", style: { padding: "14px 15px", marginBottom: 14,
      background: "#F1F9F5", borderColor: "#D3EBDF" } },
      h("div", { style: { fontSize: 13, fontWeight: 700, color: "var(--good)", marginBottom: 5 } },
        "지금 카드 조합이 가장 좋아요"),
      h("div", { className: "help", style: { color: "var(--dim)" } },
        "이번 달 소비 패턴으로 등록된 카드를 모두 비교했지만, 연회비까지 따지면 바꿔서 이득인 카드가 없었습니다."));

  return h("div", { style: { marginBottom: 14 } },
    h("div", { className: "label", style: { marginBottom: 8 } }, "카드 교체 제안"),
    swaps.map((s2, i) => {
      const isOpen = open === i;
      return h("div", { key: i, className: "card",
        style: { padding: "14px 15px", marginBottom: 7,
          borderColor: i === 0 ? "var(--brand)" : "var(--line)",
          background: i === 0 ? "var(--brand-soft)" : "var(--surface)" } },
        h("div", { style: { fontSize: 13.5, fontWeight: 700, lineHeight: 1.6,
          color: i === 0 ? "var(--brand)" : "var(--ink)" } },
          `현재 사용중인 \u2018${s2.from.name}\u2019을 `,
          h("b", null, `\u2018${s2.to.name}\u2019`),
          `${josa(s2.to.name)} 대체하시면`),
        h("div", { style: { display: "flex", alignItems: "baseline", gap: 5, margin: "8px 0 2px" } },
          h("span", { className: "num", style: { fontSize: 24, fontWeight: 800,
            color: "var(--brand)" } }, "월 " + fmt(s2.net)),
          h("span", { style: { fontSize: 13, fontWeight: 700, color: "var(--brand)" } },
            "원을 더 받아요")),
        h("div", { className: "help", style: { color: "var(--dim)", marginTop: 4 } },
          "연회비 차이까지 반영한 금액이에요."),

        h("button", { onClick: () => setOpen(isOpen ? null : i),
          style: { marginTop: 10, width: "100%", display: "flex", alignItems: "center",
            justifyContent: "space-between", padding: "9px 11px", borderRadius: 8,
            border: "1px solid var(--line)", background: "var(--surface)",
            fontSize: 12.5, fontWeight: 650, color: "var(--dim)" } },
          h("span", null, "어떻게 계산했나요?"),
          h("span", { style: { fontSize: 10, color: "var(--faint)",
            transform: isOpen ? "rotate(180deg)" : "none", transition: "transform .18s" } }, "\u25BC")),

        isOpen && h("div", { style: { marginTop: 8, padding: "12px 13px", borderRadius: 9,
          background: "var(--surface)", border: "1px solid var(--line)" } },
          h("div", { className: "help", style: { marginBottom: 9 } },
            `이번 달 \u2018${s2.from.name}\u2019로 결제한 `,
            h("b", { className: "num" }, s2.txnCount), "건(",
            h("b", { className: "num" }, fmt(s2.spend)), "원)을 그대로 옮겨 계산했어요."),
          [["지금 카드 혜택", fmt(s2.curBenefit) + "원", "var(--dim)"],
           ["바꿨을 때 혜택", fmt(s2.altBenefit) + "원", "var(--good)"],
           ["연회비 차이 (월)", (s2.feeDiffMonthly >= 0 ? "-" : "+") + fmt(Math.abs(s2.feeDiffMonthly)) + "원",
            s2.feeDiffMonthly > 0 ? "var(--brand)" : "var(--good)"]].map(([k, v, col]) =>
            h("div", { key: k, style: { display: "flex", justifyContent: "space-between",
              fontSize: 12.5, padding: "5px 0" } },
              h("span", { style: { color: "var(--dim)" } }, k),
              h("span", { className: "num", style: { fontWeight: 700, color: col } }, v))),
          h("div", { style: { display: "flex", justifyContent: "space-between",
            fontSize: 13, padding: "8px 0 0", marginTop: 4,
            borderTop: "1px solid var(--line)" } },
            h("b", null, "월 순이득"),
            h("b", { className: "num", style: { color: "var(--brand)" } }, fmt(s2.net) + "원")),
          h("div", { className: "help", style: { marginTop: 10, color: "var(--faint)",
            paddingTop: 9, borderTop: "1px dashed #DDD" } },
            "연회비는 ", h("b", null, fmt(s2.to.annualFee || 0)), "원과 ",
            h("b", null, fmt(s2.from.annualFee || 0)), "원의 차액을 12로 나눠 월 단위로 환산했습니다. ",
            "지금 소비 패턴이 계속 유지된다고 가정한 값이라 실제와 다를 수 있어요. ",
            "카드를 새로 만들면 실적 조건을 처음부터 채워야 하는 점도 함께 고려하세요.")));
    }));
}

/* ---------------- 설정 ---------------- */
function SettingsTab({ myCards, fixed, saveFixed, baseline, setBaseline, onEditCards, calcReward,
  backendUrl, reloadCards, source, syncErr }) {
  const [req, setReq] = useState("");
  const [sent, setSent] = useState(false);
  const [url, setUrl] = useState(backendUrl || "");
  const add = (p) => saveFixed(fixed.concat({
    id: uid(), label: p.label, category: p.category, amount: p.amount, day: p.day || 1,
    cardId: myCards[0]?.id || null }));
  const used = new Set(fixed.map((f) => f.label));

  return h("div", { style: { padding: "0 18px" } },
    h("section", { style: { marginBottom: 20 } },
      h("div", { className: "label", style: { marginBottom: 8 } }, "내 카드"),
      myCards.map((c) => h("div", { key: c.id, className: "card",
        style: { padding: "12px 14px", marginBottom: 6, display: "flex", alignItems: "center", gap: 9 } },
        h("span", { style: { width: 3, height: 14, borderRadius: 2, background: c.accent } }),
        h("span", { style: { fontSize: 13, fontWeight: 650, flex: 1 } }, c.name),
        h("span", { style: { fontSize: 11, color: "var(--faint)" } }, c.sub))),
      h("button", { className: "btn btn-ghost", onClick: onEditCards, style: { marginTop: 4 } },
        "카드 추가·변경")),

    h("section", { style: { marginBottom: 20 } },
      h("div", { className: "label", style: { marginBottom: 8 } }, "고정비 — 매달 자동 반영"),
      h("div", { className: "chiprow", style: { marginBottom: 9, flexWrap: "wrap", overflow: "visible" } },
        FIXED_PRESETS.filter((p) => !used.has(p.label)).map((p) =>
          h("button", { key: p.label, className: "chip", onClick: () => add(p) }, "+ " + p.label))),
      fixed.map((f) => h(FixedRow, { key: f.id, f, myCards, calcReward,
        patch: (k, v) => saveFixed(fixed.map((x) => (x.id === f.id ? { ...x, [k]: v } : x))),
        remove: () => saveFixed(fixed.filter((x) => x.id !== f.id)) }))),

    h("section", { style: { marginBottom: 20 } },
      h("div", { className: "label", style: { marginBottom: 8 } }, "실적 수정"),
      myCards.filter((c) => c.tiers[0] > 0).map((c) => {
        const b = baseline[c.id] || {};
        const opts = [{ idx: -1, label: `${fmt(c.tiers[0] / 10000)}만원 미만` }].concat(
          c.tiers.map((t, i) => ({ idx: i,
            label: c.tiers[i + 1]
              ? `${fmt(t / 10000)}~${fmt(c.tiers[i + 1] / 10000)}만원`
              : `${fmt(t / 10000)}만원 이상` })));
        return h("div", { key: c.id, className: "card", style: { padding: "13px 14px", marginBottom: 7 } },
          h("b", { style: { fontSize: 13.5, display: "block", marginBottom: 10 } }, c.name),
          h("span", { className: "label" }, "지난달 이용 금액"),
          h("div", { style: { display: "flex", flexWrap: "wrap", gap: 6, marginBottom: 12 } },
            opts.map((o) => h("button", { key: o.idx,
              className: "chip" + (b.tier === o.idx ? " on" : ""),
              onClick: () => setBaseline({ ...baseline, [c.id]: { ...b, tier: o.idx } }) }, o.label))),
          h("span", { className: "label" }, "당월 앱 사용 전까지의 이용 금액"),
          h(MoneyInput, { value: b.curr ?? "",
            onChange: (v) => setBaseline({ ...baseline, [c.id]: { ...b, curr: Number(v) || 0 } }) }),
          c.newGrace && h("div", { style: { marginTop: 10 } },
            h("span", { className: "label" }, "신규 발급 유예 기간"),
            h("div", { style: { display: "flex", gap: 6 } },
              [[true, "해당됨"], [false, "해당 없음"]].map(([v, label]) =>
                h("button", { key: String(v),
                  className: "chip" + (b.isNew === v ? " on" : ""),
                  onClick: () => setBaseline({ ...baseline, [c.id]: { ...b, isNew: v } }),
                  style: { flex: 1, textAlign: "center" } }, label))),
            h("div", { className: "help", style: { marginTop: 6, color: "var(--faint)" } },
              c.newGrace.note)));
      })),

    h("section", { style: { marginBottom: 20 } },
      h("div", { className: "label", style: { marginBottom: 8 } }, "카드 혜택 데이터"),
      h("div", { className: "card", style: { padding: 14 } },
        h("div", { style: { display: "flex", alignItems: "center", gap: 8, marginBottom: 10 } },
          h("span", { style: { fontSize: 13, fontWeight: 650, flex: 1 } },
            source === "백엔드" ? "서버에서 불러옴" : source === "캐시" ? "저장된 목록 사용 중" : "앱 내장 데모"),
          h("span", { style: { fontSize: 11, fontWeight: 700, padding: "3px 8px", borderRadius: 5,
            background: source === "백엔드" ? "#F1F9F5" : "var(--warn-soft)",
            color: source === "백엔드" ? "var(--good)" : "var(--warn)" } }, source)),
        h("input", { className: "field", value: url, placeholder: "https://...workers.dev",
          onChange: (e) => setUrl(e.target.value),
          style: { fontFamily: "var(--sans)", fontSize: 13, textAlign: "left", marginBottom: 8 } }),
        h("button", { className: "btn btn-ghost", onClick: () => reloadCards(url) }, "다시 불러오기"),
        syncErr && h("div", { className: "help", style: { color: "var(--warn)", marginTop: 8 } }, syncErr))),

    h("section", { style: { marginBottom: 24 } },
      h("div", { className: "label", style: { marginBottom: 8 } }, "카드 요청"),
      h("div", { className: "card", style: { padding: 14 } },
        h("p", { style: { fontSize: 12, color: "var(--dim)", margin: "0 0 10px", lineHeight: 1.6 } },
          "목록에 없는 카드를 알려주시면 혜택 정보를 준비해 업데이트할게요."),
        h("input", { className: "field", placeholder: "예: 현대카드 M BOOST", value: req,
          onChange: (e) => { setReq(e.target.value); setSent(false); },
          style: { fontFamily: "var(--sans)", fontSize: 14, marginBottom: 9 } }),
        sent
          ? h("div", { style: { fontSize: 13, color: "var(--good)", fontWeight: 600, textAlign: "center",
              padding: "12px 0" } }, "요청을 보냈어요. 준비되면 알려드릴게요.")
          : h("button", { className: "btn btn-primary", disabled: !req.trim(),
              onClick: () => { setSent(true); setReq(""); } }, "요청 보내기"))),

    h("div", { style: { textAlign: "center", fontSize: 11, color: "var(--faint)",
      paddingBottom: 20, lineHeight: 1.7 } },
      "입력한 내용은 이 기기에만 저장됩니다.", h("br"), "Chepicky 데모"));
}

window.ReactDOM.createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
