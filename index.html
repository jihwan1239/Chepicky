/* 이 기기의 브라우저 저장소에 보관 */
(function () {
  var NS = "cardpicker:";
  window.storage = {
    get: function (key) {
      var raw = localStorage.getItem(NS + key);
      if (raw === null) return Promise.reject(new Error("not found"));
      return Promise.resolve({ key: key, value: raw });
    },
    set: function (key, value) {
      localStorage.setItem(NS + key, value);
      return Promise.resolve({ key: key, value: value });
    },
    delete: function (key) {
      var had = localStorage.getItem(NS + key) !== null;
      localStorage.removeItem(NS + key);
      return Promise.resolve({ key: key, deleted: had });
    },
    list: function (prefix) {
      var p = NS + (prefix || "");
      return Promise.resolve({
        keys: Object.keys(localStorage).filter(function (k) { return k.indexOf(p) === 0; })
          .map(function (k) { return k.slice(NS.length); })
      });
    }
  };
})();
window.addEventListener("error", function (e) {
  var b = document.getElementById("boot");
  if (b) b.textContent = "오류: " + (e.message || e);
});
</script>

function numberToKorean(num) {
  const n = Number(num);
  if (!n || isNaN(n) || n <= 0) return "";
  const digits = ["", "일", "이", "삼", "사", "오", "육", "칠", "팔", "구"];
  const units = ["", "십", "백", "천"];
  const bigUnits = ["", "만", "억", "조"];
  
  let str = String(Math.floor(n));
  let len = str.length;
  let parts = [];
  
  for (let i = 0; i < len; i += 4) {
    let chunk = str.slice(Math.max(0, len - i - 4), len - i);
    let chunkKor = "";
    let cLen = chunk.length;
    
    for (let j = 0; j < cLen; j++) {
      let d = parseInt(chunk[j], 10);
      if (d > 0) {
        let u = units[cLen - 1 - j];
        let digitStr = digits[d];
        if (d === 1 && u !== "") digitStr = "";
        chunkKor += digitStr + u;
      }
    }
    if (chunkKor) {
      parts.unshift(chunkKor + bigUnits[i / 4]);
    }
  }
  return parts.join(" ") + "원";
}

    const sd = startDay || 1;
    let baseMonth = d.getMonth();
    if (d.getDate() >= sd) baseMonth += 1;
    const out = [];
    for (let i = 0; i < n; i++)
        out.push(yyyymm(new Date(d.getFullYear(), baseMonth + i, 1)));

};
